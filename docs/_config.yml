title: gonfiguration
tagline: Go structs filled from environment variables
description: A thread-safe Go library that fills a struct from environment variables through struct tags, with defaults, required fields and errors that say where they came from.
lang: en
url: https://psyb0t.github.io
baseurl: /gonfiguration
repository: psyb0t/gonfiguration
author: Ciprian Mandache

